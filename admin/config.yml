backend:
  name: git-gateway
  branch: main

# Where uploaded images (cover photos) get saved, and the path used to
# reference them in the JSON — matches the assets/ folder already in use
# sitewide.
media_folder: "assets/uploads"
public_folder: "assets/uploads"

# Shows a live preview of edits inside the admin panel before publishing.
show_preview_links: true

collections:
  - name: "articles"
    label: "Articles"
    files:
      - name: "articles"
        label: "All Articles"
        file: "assets/data/articles.json"
        fields:
          - name: "articles"
            label: "Articles"
            widget: "list"
            label_singular: "Article"
            summary: "{{title}} — {{tag}}"
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - {
                  name: "slug",
                  label: "URL Slug",
                  widget: "string",
                  hint: "Used in the article's web address, e.g. 'startup-act' becomes /article.html?slug=startup-act. Use lowercase letters and hyphens only, no spaces.",
                }
              - name: "tag"
                label: "Practice Area"
                widget: "select"
                options:
                  - "Corporate & Commercial"
                  - "Startup & VC Advisory"
                  - "Intellectual Property"
                  - "Regulatory & Compliance"
                  - "Dispute Resolution"
                  - "Tax Advisory"
              - {
                  name: "author",
                  label: "Author",
                  widget: "string",
                  default: "Timi Ogunyemi",
                }
              - { name: "date", label: "Publish Date", widget: "date" }
              - {
                  name: "readTime",
                  label: "Read Time",
                  widget: "string",
                  hint: "e.g. '5 min read'",
                  default: "5 min read",
                }
              - {
                  name: "cover",
                  label: "Cover Image",
                  widget: "image",
                  hint: "Recommended size: at least 1200px wide, landscape orientation.",
                }
              - {
                  name: "excerpt",
                  label: "Short Summary",
                  widget: "text",
                  hint: "1-2 sentences. Shown on the Articles list page and in link previews when shared.",
                }
              - {
                  name: "featured",
                  label: "Show in Editor's Picks",
                  widget: "boolean",
                  default: false,
                  hint: "Turn this on to feature the article in the sidebar 'Editor's Picks' block.",
                }
              - {
                  name: "body",
                  label: "Article Content",
                  widget: "markdown",
                  hint: "Write the full article here. Use headings for section breaks.",
                }
